name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка лёгких зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn numpy
      - name: Синтаксис Python
        run: python -m compileall -q voice silero tests
      - name: Регрессии (tool-история, немедленный EOG)
        run: python tests/test_tool_history.py

  # C++ демон здесь не собирается: нужен форк PrismML-Eng/llama.cpp с типом
  # PQ2_0 (гугл-тест не пройдёт на раннере без CUDA). Сборка — scripts/build_daemon.sh
  # на целевой машине, см. README/AGENTS.
